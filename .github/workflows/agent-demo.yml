name: Agent demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  end-to-end-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r CityLens/requirements.txt
      - run: python demo.py
        working-directory: CityLens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-demo-evidence
          path: CityLens/reports/demo/
