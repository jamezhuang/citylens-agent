name: Web demo checks
on:
  push:
    paths:
      - 'CityLens/frontend/**'
      - '.github/workflows/web-demo.yml'
  pull_request:
    paths:
      - 'CityLens/frontend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CityLens/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CityLens/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: citylens-online-demo
          path: CityLens/frontend/dist/
